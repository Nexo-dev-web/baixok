<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baixo K - entrar</title>
  <link rel="icon" href="images/baixok-logo-v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="entrar">
  <main class="entrar-page">
    <form class="entrar-card" onsubmit="entrarNoBalcao(event)">
      <img src="images/baixok-logo-v2.png" alt="Baixo K">
      <div>
        <h1>Baixo K</h1>
        <p>Painel da loja. Use a senha do balcao para entrar.</p>
      </div>
      <input id="senha" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Senha da loja" required autofocus>
      <p class="form-error hidden" id="entrar-erro"></p>
      <button class="primary wide" type="submit">Entrar</button>
      <a class="secondary wide" href="index.html">← Ver o cardapio</a>
    </form>
  </main>

  <script>
    async function entrarNoBalcao(event) {
      event.preventDefault();
      const erro = document.getElementById("entrar-erro");
      erro.classList.add("hidden");
      try {
        const resposta = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ senha: document.getElementById("senha").value })
        });
        if (resposta.ok) return location.replace(new URLSearchParams(location.search).get("de") || "admin.html");
        const dados = await resposta.json().catch(() => ({}));
        erro.textContent = dados.erro || "Nao foi possivel entrar.";
      } catch {
        erro.textContent = "Servidor fora do ar. Verifique se o `node server.js` esta rodando.";
      }
      erro.classList.remove("hidden");
    }
  </script>
</body>
</html>
